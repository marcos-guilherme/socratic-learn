name: Native Python safety matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build deterministic distribution
        run: python -m socratic_learn build
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository
        run: python tests/validate_repository.py
      - name: Build wheel
        run: python -m build --wheel --outdir "${{ runner.temp }}/wheelhouse"
      - name: Smoke test installed socratic --version
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          import venv

          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          environment = temporary / "package-smoke"
          venv.EnvBuilder(with_pip=True).create(environment)
          scripts = environment / ("Scripts" if sys.platform == "win32" else "bin")
          python = scripts / ("python.exe" if sys.platform == "win32" else "python")
          socratic = scripts / ("socratic.exe" if sys.platform == "win32" else "socratic")
          wheel = next((temporary / "wheelhouse").glob("*.whl"))
          subprocess.run(
              [str(python), "-m", "pip", "install", "--no-deps", str(wheel)],
              check=True,
          )
          subprocess.run([str(socratic), "--version"], check=True)
      - name: Smoke install update and doctor
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import tempfile

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root))
          from tests.legacy_install_fixture import create_valid_legacy_install

          with tempfile.TemporaryDirectory() as temporary:
              project = pathlib.Path(temporary) / "project"
              project.mkdir()
              command = [sys.executable, "-m", "socratic_learn"]
              subprocess.run(
                  [*command, "install", "generic", str(project)],
                  cwd=root,
                  check=True,
              )
              subprocess.run(
                  [*command, "install", "generic", str(project), "--update"],
                  cwd=root,
                  check=True,
              )
              legacy_project = pathlib.Path(temporary) / "legacy-project"
              legacy_project.mkdir()
              create_valid_legacy_install(legacy_project, target="generic")
              subprocess.run(
                  [
                      *command,
                      "install",
                      "generic",
                      str(legacy_project),
                      "--update",
                  ],
                  cwd=root,
                  check=True,
              )
              subprocess.run(
                  [*command, "doctor", str(legacy_project)],
                  cwd=root,
                  check=True,
              )
              subprocess.run(
                  [*command, "doctor", str(project)],
                  cwd=root,
                  check=True,
              )
      - name: Check generated diff and repository status
        shell: python
        run: |
          import subprocess

          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "diff", "--exit-code"], check=True)
          status = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          if status:
              raise SystemExit(f"repository is dirty after validation:\n{status}")
