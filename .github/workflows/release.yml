name: Native release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require an exact version tag
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from socratic_learn import __version__

          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              expected = f"v{__version__}"
              actual = os.environ["GITHUB_REF_NAME"]
              if actual != expected:
                  raise SystemExit(
                      f"release tag {actual!r} does not match package {expected!r}"
                  )
          elif os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch":
              raise SystemExit(f"unsupported release ref: {ref}")

  python-package:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build deterministic distribution
        run: python -m socratic_learn build
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository
        run: python tests/validate_repository.py
      - name: Build wheel and source distribution
        run: python -m build --outdir release-dist
      - name: Smoke test installed socratic --version
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import venv

          root = pathlib.Path.cwd()
          environment = root / "package-smoke"
          venv.EnvBuilder(with_pip=True).create(environment)
          scripts = environment / ("Scripts" if sys.platform == "win32" else "bin")
          python = scripts / ("python.exe" if sys.platform == "win32" else "python")
          socratic = scripts / ("socratic.exe" if sys.platform == "win32" else "socratic")
          wheel = next((root / "release-dist").glob("*.whl"))
          subprocess.run(
              [str(python), "-m", "pip", "install", "--no-deps", str(wheel)],
              check=True,
          )
          subprocess.run([str(socratic), "--version"], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: release-dist/*

  native:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            extension: .exe
          - os: ubuntu-latest
            platform: linux
            extension: ""
          - os: macos-13
            platform: macos
            extension: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository
        run: python tests/validate_repository.py
      - name: Build native executable
        run: python -m PyInstaller socratic-learn.spec --noconfirm --distpath dist-native --workpath build-native
      - name: Rename and smoke test socratic --version
        shell: python
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXTENSION: ${{ matrix.extension }}
        run: |
          import os
          import pathlib
          import shutil
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          source = root / "dist-native" / (
              "socratic.exe" if sys.platform == "win32" else "socratic"
          )
          destination = root / "native-artifacts" / (
              f"socratic-{os.environ['RELEASE_PLATFORM']}-x86_64"
              f"{os.environ['RELEASE_EXTENSION']}"
          )
          destination.parent.mkdir()
          shutil.move(source, destination)
          subprocess.run([str(destination.resolve()), "--version"], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native-artifacts/socratic-${{ matrix.platform }}-x86_64${{ matrix.extension }}

  manifest:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4,<5"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: downloaded-native
          merge-multiple: true
      - name: Compute and validate release metadata
        shell: python
        run: |
          import hashlib
          import json
          import pathlib

          import jsonschema

          from socratic_learn import __version__
          from socratic_learn.release import parse_release_manifest

          root = pathlib.Path.cwd()
          native = root / "downloaded-native"
          output = root / "release-metadata"
          output.mkdir()
          artifacts = []
          for path in sorted(native.iterdir()):
              platform = path.name.removeprefix("socratic-").split("-", 1)[0]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append(
                  {
                      "platform": platform,
                      "architecture": "x86_64",
                      "filename": path.name,
                      "size": path.stat().st_size,
                      "sha256": digest,
                  }
              )
          manifest = {
              "schema_version": 1,
              "version": __version__,
              "artifacts": artifacts,
          }
          manifest_bytes = (
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          ).encode()
          schema = json.loads(
              (root / "release-manifest.schema.json").read_text(encoding="utf-8")
          )
          jsonschema.validate(manifest, schema)
          parse_release_manifest(manifest_bytes, "https://example.invalid/")
          (output / "release-manifest.json").write_bytes(manifest_bytes)
          separator = '  '
          checksums = "".join(
              f"{artifact['sha256']}{separator}{artifact['filename']}\n"
              for artifact in artifacts
          )
          (output / "SHA256SUMS").write_text(
              checksums,
              encoding="ascii",
              newline="\n",
          )
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/*

  publish-github:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, native, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-assets/packages
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-assets/metadata
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/packages/*
          release-assets/native/*
          release-assets/metadata/SHA256SUMS
          release-assets/metadata/release-manifest.json
          scripts/install.ps1
          scripts/install.sh
          --verify-tag
          --generate-notes

  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-package, native, manifest]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: release-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist/
